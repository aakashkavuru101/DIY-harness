<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="DejaVu Sans, Verdana, Arial, sans-serif" role="img" aria-label="Guides steer before the agent acts, sensors check after, human gates sit between">
<title>Guides steer before the agent acts, sensors check after, human gates sit between</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1B2A41"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2F6FDB"/></marker></defs>
<rect width="960" height="300" fill="#FFFFFF"/>
<text x="28.0" y="26.0" font-size="14" fill="#1B2A41" text-anchor="start" font-weight="bold">Agent = model + harness: guides before, sensors after</text>
<rect x="28" y="66" width="200" height="132" rx="8" fill="#EEF3FC" stroke="#1B2A41" stroke-width="1.4"/>
<text x="128.0" y="84.0" font-size="9" fill="#2F6FDB" text-anchor="middle" font-weight="bold">BEFORE</text>
<text x="128.0" y="102.0" font-size="12" fill="#1B2A41" text-anchor="middle" font-weight="bold">Guides</text>
<text x="128.0" y="119.5" font-size="9.5" fill="#5B6576" text-anchor="middle">Steering files · scoped rules · skills ·</text>
<text x="128.0" y="132.0" font-size="9.5" fill="#5B6576" text-anchor="middle">tool limits · specs and tickets</text>
<line x1="228" y1="132" x2="268" y2="132" stroke="#1B2A41" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="270" y="86" width="150" height="92" rx="8" fill="#FFF4E0" stroke="#B7791F" stroke-width="1.4"/>
<text x="345.0" y="107.5" font-size="11.5" fill="#1B2A41" text-anchor="middle" font-weight="bold">Human gate</text>
<text x="345.0" y="124.5" font-size="9" fill="#5B6576" text-anchor="middle">High-impact decisions only.</text>
<text x="345.0" y="136.5" font-size="9" fill="#5B6576" text-anchor="middle">Routine ones use recorded</text>
<text x="345.0" y="148.5" font-size="9" fill="#5B6576" text-anchor="middle">defaults</text>
<line x1="420" y1="132" x2="460" y2="132" stroke="#1B2A41" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="462" y="86" width="150" height="92" rx="8" fill="#1B2A41" stroke="#1B2A41" stroke-width="1.4"/>
<text x="537.0" y="108.0" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Agent acts</text>
<text x="537.0" y="125.5" font-size="9.5" fill="#C9D6EE" text-anchor="middle">inside permissions, hooks</text>
<text x="537.0" y="138.0" font-size="9.5" fill="#C9D6EE" text-anchor="middle">and sandbox</text>
<line x1="612" y1="132" x2="652" y2="132" stroke="#1B2A41" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="654" y="66" width="200" height="132" rx="8" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="1.4"/>
<text x="754.0" y="84.0" font-size="9" fill="#2F6FDB" text-anchor="middle" font-weight="bold">AFTER</text>
<text x="754.0" y="102.0" font-size="12" fill="#1B2A41" text-anchor="middle" font-weight="bold">Sensors</text>
<text x="754.0" y="119.5" font-size="9.5" fill="#5B6576" text-anchor="middle">Tests · linters · type and architecture</text>
<text x="754.0" y="132.0" font-size="9.5" fill="#5B6576" text-anchor="middle">checks · review · evals</text>
<line x1="854" y1="132" x2="890" y2="132" stroke="#1B2A41" stroke-width="1.5" marker-end="url(#a)"/>
<text x="912.0" y="136.0" font-size="10.5" fill="#1B2A41" text-anchor="middle" font-weight="bold">done</text>
<path d="M754 200 L754 226 L537 226 L537 181" fill="none" stroke="#2F6FDB" stroke-width="1.5" marker-end="url(#b)" stroke-dasharray="5 4"/>
<text x="646.0" y="242.0" font-size="9" fill="#2F6FDB" text-anchor="middle">red: verbose failure, with the fix</text>
<path d="M790 200 L790 262 L128 262 L128 201" fill="none" stroke="#2F6FDB" stroke-width="1.5" marker-end="url(#b)" stroke-dasharray="5 4"/>
<text x="459.0" y="280.0" font-size="9" fill="#2F6FDB" text-anchor="middle">same failure twice: retro turns it into a new control (prose rule, then a mechanical check)</text>
</svg>
