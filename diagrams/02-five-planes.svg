<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="DejaVu Sans, Verdana, Arial, sans-serif" role="img" aria-label="The five planes of a harness around the agent loop">
<title>The five planes of a harness around the agent loop</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1B2A41"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2F6FDB"/></marker></defs>
<rect width="960" height="400" fill="#FFFFFF"/>
<text x="28.0" y="26.0" font-size="14" fill="#1B2A41" text-anchor="start" font-weight="bold">A harness: five planes around the agent loop</text>
<text x="150.0" y="56.0" font-size="10" fill="#2F6FDB" text-anchor="middle" font-weight="bold">GUIDES: steer before the agent acts</text>
<rect x="28" y="66" width="244" height="84" rx="8" fill="#EEF3FC" stroke="#1B2A41" stroke-width="1.4"/>
<text x="150.0" y="88.0" font-size="12" fill="#1B2A41" text-anchor="middle" font-weight="bold">Protocol</text>
<text x="150.0" y="105.5" font-size="9.5" fill="#5B6576" text-anchor="middle">How human and agent work together. Goal</text>
<text x="150.0" y="118.0" font-size="9.5" fill="#5B6576" text-anchor="middle">lock, working agreement, state handoff,</text>
<text x="150.0" y="130.5" font-size="9.5" fill="#5B6576" text-anchor="middle">autonomy tier</text>
<line x1="272" y1="108" x2="356" y2="158" stroke="#1B2A41" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="28" y="162" width="244" height="84" rx="8" fill="#EEF3FC" stroke="#1B2A41" stroke-width="1.4"/>
<text x="150.0" y="184.0" font-size="12" fill="#1B2A41" text-anchor="middle" font-weight="bold">Cognition</text>
<text x="150.0" y="201.5" font-size="9.5" fill="#5B6576" text-anchor="middle">How the agent thinks about this work.</text>
<text x="150.0" y="214.0" font-size="9.5" fill="#5B6576" text-anchor="middle">Always-on rules, project skills, context policy,</text>
<text x="150.0" y="226.5" font-size="9.5" fill="#5B6576" text-anchor="middle">routing</text>
<line x1="272" y1="204" x2="356" y2="180" stroke="#1B2A41" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="28" y="258" width="244" height="84" rx="8" fill="#EEF3FC" stroke="#1B2A41" stroke-width="1.4"/>
<text x="150.0" y="280.0" font-size="12" fill="#1B2A41" text-anchor="middle" font-weight="bold">Knowledge</text>
<text x="150.0" y="297.5" font-size="9.5" fill="#5B6576" text-anchor="middle">What the agent knows without asking.</text>
<text x="150.0" y="310.0" font-size="9.5" fill="#5B6576" text-anchor="middle">Glossary, ADRs, reference docs, failure log</text>
<line x1="272" y1="300" x2="356" y2="202" stroke="#1B2A41" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="358" y="120" width="244" height="120" rx="8" fill="#1B2A41" stroke="#1B2A41" stroke-width="1.4"/>
<text x="480.0" y="144.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Agent loop</text>
<text x="480.0" y="162.0" font-size="10" fill="#C9D6EE" text-anchor="middle">model + tools, working toward GOAL.md</text>
<text x="480.0" y="175.0" font-size="10" fill="#C9D6EE" text-anchor="middle"></text>
<text x="480.0" y="188.0" font-size="10" fill="#C9D6EE" text-anchor="middle">read · plan · act · observe</text>
<text x="810.0" y="56.0" font-size="10" fill="#2F6FDB" text-anchor="middle" font-weight="bold">SENSORS: check after the agent acts</text>
<rect x="688" y="66" width="244" height="228" rx="8" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="1.4"/>
<text x="810.0" y="88.0" font-size="12" fill="#1B2A41" text-anchor="middle" font-weight="bold">Quality</text>
<text x="810.0" y="105.5" font-size="9.5" fill="#5B6576" text-anchor="middle">How anyone knows the work is right.</text>
<text x="810.0" y="118.0" font-size="9.5" fill="#5B6576" text-anchor="middle"></text>
<text x="810.0" y="130.5" font-size="9.5" fill="#5B6576" text-anchor="middle">One check that goes red · pre-commit and CI ·</text>
<text x="810.0" y="143.0" font-size="9.5" fill="#5B6576" text-anchor="middle">TDD at agreed seams · two-axis review · retro ·</text>
<text x="810.0" y="155.5" font-size="9.5" fill="#5B6576" text-anchor="middle">evals · telemetry</text>
<line x1="602" y1="165" x2="686" y2="165" stroke="#1B2A41" stroke-width="1.5" marker-end="url(#a)"/>
<text x="644.0" y="159.0" font-size="9" fill="#5B6576" text-anchor="middle">output</text>
<line x1="686" y1="205" x2="604" y2="205" stroke="#2F6FDB" stroke-width="1.5" marker-end="url(#b)" stroke-dasharray="5 4"/>
<text x="645.0" y="219.0" font-size="9" fill="#2F6FDB" text-anchor="middle">failures feed back</text>
<rect x="358" y="300" width="244" height="84" rx="8" fill="#FFF4E0" stroke="#B7791F" stroke-width="1.4"/>
<text x="480.0" y="322.0" font-size="12" fill="#1B2A41" text-anchor="middle" font-weight="bold">Integration</text>
<text x="480.0" y="339.5" font-size="9.5" fill="#5B6576" text-anchor="middle">What the agent can reach. CLIs, MCP servers,</text>
<text x="480.0" y="352.0" font-size="9.5" fill="#5B6576" text-anchor="middle">CI, sandbox, permissions</text>
<line x1="480" y1="298" x2="480" y2="242" stroke="#1B2A41" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="455" y1="242" x2="455" y2="298" stroke="#1B2A41" stroke-width="1.5" marker-end="url(#a)"/>
<text x="810.0" y="318.0" font-size="9.5" fill="#5B6576" text-anchor="middle">Guardrails and operations are views</text>
<text x="810.0" y="331.0" font-size="9.5" fill="#5B6576" text-anchor="middle">across these planes, not extra planes</text>
<text x="150.0" y="372.0" font-size="9.5" fill="#5B6576" text-anchor="middle">Each part belongs to exactly one plane</text>
</svg>
