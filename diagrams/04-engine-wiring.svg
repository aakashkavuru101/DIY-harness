<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="DejaVu Sans, Verdana, Arial, sans-serif" role="img" aria-label="How the parent command reaches the three upstream repositories">
<title>How the parent command reaches the three upstream repositories</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1B2A41"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2F6FDB"/></marker></defs>
<rect width="960" height="470" fill="#FFFFFF"/>
<text x="28.0" y="26.0" font-size="14" fill="#1B2A41" text-anchor="start" font-weight="bold">One parent command, three ways to reach the engine</text>
<rect x="28" y="40" width="110" height="58" rx="8" fill="#FFFFFF" stroke="#1B2A41" stroke-width="1.4"/>
<text x="83.0" y="62.0" font-size="12" fill="#1B2A41" text-anchor="middle" font-weight="bold">User</text>
<text x="83.0" y="79.5" font-size="9.5" fill="#5B6576" text-anchor="middle">one command</text>
<line x1="138" y1="69" x2="196" y2="69" stroke="#1B2A41" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="198" y="40" width="734" height="58" rx="8" fill="#1B2A41" stroke="#1B2A41" stroke-width="1.4"/>
<text x="565.0" y="63.0" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">/diy-harness (parent, user-invoked)</text>
<text x="565.0" y="81.0" font-size="10" fill="#C9D6EE" text-anchor="middle">Runs stages S0 to S6. Holds the harness knowledge: levels, parts, guardrails, ops</text>
<rect x="28" y="140" width="280" height="168" rx="8" fill="#EEF3FC" stroke="#1B2A41" stroke-width="1.4"/>
<text x="168.0" y="163.0" font-size="13" fill="#1B2A41" text-anchor="middle" font-weight="bold">Engine skills</text>
<text x="168.0" y="180.5" font-size="9.5" fill="#5B6576" text-anchor="middle">called with the Skill tool (or read ../name/SKILL.md)</text>
<text x="168.0" y="226.0" font-size="9.5" fill="#1B2A41" text-anchor="middle">grilling · domain-modeling · codebase-design ·</text>
<text x="168.0" y="239.0" font-size="9.5" fill="#1B2A41" text-anchor="middle">prototype · research · tdd · code-review ·</text>
<text x="168.0" y="252.0" font-size="9.5" fill="#1B2A41" text-anchor="middle">diagnosing-bugs · wizard · pr · writing-for-agents ·</text>
<text x="168.0" y="265.0" font-size="9.5" fill="#1B2A41" text-anchor="middle">ponytail-audit · ponytail-debt</text>
<line x1="168" y1="100" x2="168" y2="138" stroke="#1B2A41" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="340" y="140" width="280" height="168" rx="8" fill="#FFF4E0" stroke="#B7791F" stroke-width="1.4"/>
<text x="480.0" y="163.0" font-size="13" fill="#1B2A41" text-anchor="middle" font-weight="bold">Stage playbooks</text>
<text x="480.0" y="180.5" font-size="9.5" fill="#5B6576" text-anchor="middle">read as files inside the parent; cannot fire by accident</text>
<text x="480.0" y="226.0" font-size="9.5" fill="#1B2A41" text-anchor="middle">to-spec (S3) · to-tickets (S4) · implement (S5) ·</text>
<text x="480.0" y="239.0" font-size="9.5" fill="#1B2A41" text-anchor="middle">implement-spec (S5, L4) · retro (S6)</text>
<line x1="480" y1="100" x2="480" y2="138" stroke="#1B2A41" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="652" y="140" width="280" height="168" rx="8" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="1.4"/>
<text x="792.0" y="163.0" font-size="13" fill="#1B2A41" text-anchor="middle" font-weight="bold">Always-on rules</text>
<text x="792.0" y="180.5" font-size="9.5" fill="#5B6576" text-anchor="middle">injected every session by a SessionStart hook, in</text>
<text x="792.0" y="193.0" font-size="9.5" fill="#5B6576" text-anchor="middle">Claude Code and Codex</text>
<text x="792.0" y="226.0" font-size="9.5" fill="#1B2A41" text-anchor="middle">working agreement · ponytail build rules ·</text>
<text x="792.0" y="239.0" font-size="9.5" fill="#1B2A41" text-anchor="middle">i-have-adhd output rules</text>
